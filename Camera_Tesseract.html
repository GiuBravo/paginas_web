<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YGO Vision - V39 Final Sniper</title>
    <script src="https://unpkg.com/tesseract.js@v4.0.1/dist/tesseract.min.js"></script>
    <style>
        body { margin: 0; background: #000; font-family: sans-serif; height: 100dvh; overflow: hidden; color: white; }
        #video { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        
        /* MIRA MICRO-SNIPER (40% de largura) */
        #scanner-visual {
            position: absolute; top: 22%; left: 50%; transform: translateX(-50%);
            width: 40%; height: 28px; z-index: 10; pointer-events: none;
        }
        .corner { position: absolute; width: 10px; height: 10px; border: 3px solid #2ecc71; border-radius: 1px; }
        .tl { top: 0; left: 0; border-right: 0; border-bottom: 0; }
        .tr { top: 0; right: 0; border-left: 0; border-bottom: 0; }
        .bl { bottom: 0; left: 0; border-right: 0; border-top: 0; }
        .br { bottom: 0; right: 0; border-left: 0; border-top: 0; }
        #scanner-visual.active .corner { border-color: #f1c40f; box-shadow: 0 0 12px #f1c40f; }

        #ui-panel { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(10,10,10,0.94); padding: 12px; z-index: 100; border-top: 1px solid #333; }
        #log-console { height: 95px; overflow-y: auto; font-size: 10px; color: #0f0; background: #000; padding: 10px; font-family: monospace; }
        
        #preview-box { position: absolute; top: 10px; right: 10px; width: 150px; border: 2px solid #fff; z-index: 100; background: #000; border-radius: 4px; overflow: hidden; }
        #preview-canvas { width: 100%; display: block; height: 35px; }

        #card-popup {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #1a1a1a; border-radius: 20px; padding: 20px; width: 85%;
            display: none; flex-direction: column; align-items: center; z-index: 200; border: 3px solid #2ecc71;
            box-shadow: 0 10px 60px rgba(0,0,0,1);
        }
    </style>
</head>
<body>

    <video id="video" autoplay playsinline></video>
    <div id="scanner-visual">
        <div class="corner tl"></div><div class="corner tr"></div>
        <div class="corner bl"></div><div class="corner br"></div>
    </div>

    <div id="preview-box">
        <canvas id="preview-canvas"></canvas>
        <div style="font-size:7px; text-align:center; background:#fff; color:#000; font-weight:bold; padding:2px;">VISÃO DO ROBÔ V39</div>
    </div>

    <div id="card-popup">
        <img id="res-img" src="" style="width: 150px; border-radius: 8px;">
        <h3 id="res-name" style="text-align:center; margin: 15px 0 5px 0; font-size: 18px;"></h3>
        <span id="res-price" style="color:#2ecc71; font-weight:bold; font-size: 22px;"></span>
        <button onclick="closePopup()" style="margin-top:20px; width:100%; padding:15px; background:#e74c3c; border:none; color:white; border-radius:12px; font-weight:bold;">FECHAR</button>
    </div>

    <div id="ui-panel">
        <div style="display:flex; justify-content:space-between; margin-bottom:5px; font-size:10px;">
            <span id="engine-status" style="color:#f1c40f;">🔍 RASTREANDO NOME...</span>
            <button onclick="copyLogs()" style="background:#333; color:#ccc; border:none; padding:2px 8px; border-radius:4px;">Copiar Logs</button>
        </div>
        <div id="log-console">Sincronizando Sniper 40%...</div>
    </div>

    <canvas id="canvas-internal" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video');
        const log = document.getElementById('log-console');
        const status = document.getElementById('engine-status');
        const mira = document.getElementById('scanner-visual');
        const canvas = document.getElementById('canvas-internal');
        const preview = document.getElementById('preview-canvas');
        
        let isPaused = false;
        let isProcessing = false;
        let localCache = [];
        let lastSearch = "";

        function addLog(msg) {
            const t = new Date().toLocaleTimeString().split(' ')[0];
            log.innerHTML += `<br>[${t}] ${msg}`;
            log.scrollTop = log.scrollHeight;
        }

        window.copyLogs = () => {
            navigator.clipboard.writeText(log.innerText).then(() => alert("Copiado!"));
        };

        function closePopup() {
            document.getElementById('card-popup').style.display = 'none';
            isPaused = false;
            mira.classList.remove('active');
        }

        async function init() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } }
                });
                video.srcObject = stream;
                addLog("V39 Online. Mira Sniper Calibrada.");
                requestAnimationFrame(loop);
            } catch (e) { addLog("Erro: " + e.message); }
        }

        function normalize(text) {
            if (!text) return "";
            return text.toUpperCase()
                .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                .replace(/[^A-Z0-9 ]/g, " ")
                .replace(/\b(O|A|DE|DO|DA|OS|AS|DOS|DAS)\b/g, "")
                .replace(/\s+/g, " ")
                .trim();
        }

        async function loop() {
            if (isPaused || isProcessing || video.videoWidth === 0) {
                requestAnimationFrame(loop);
                return;
            }

            isProcessing = true;
            try {
                const ctx = canvas.getContext('2d');
                const vW = video.videoWidth; const vH = video.videoHeight;
                const videoRect = video.getBoundingClientRect();
                const miraRect = mira.getBoundingClientRect();

                // CÁLCULO DE SINCRONIA 1:1 (Mapeia o centro exato do box de 40%)
                const videoRatio = vW / vH;
                const containerRatio = videoRect.width / videoRect.height;
                let s, xO = 0, yO = 0;
                if (videoRatio > containerRatio) { s = vH / videoRect.height; xO = (vW - videoRect.width * s) / 2; }
                else { s = vW / videoRect.width; yO = (vH - videoRect.height * s) / 2; }

                const sX = (miraRect.left - videoRect.left) * s + xO;
                const sY = (miraRect.top - videoRect.top) * s + yO;
                const sW = miraRect.width * s;
                const sH = miraRect.height * s;

                canvas.width = 800; canvas.height = 100;
                ctx.fillStyle = "black"; ctx.fillRect(0,0,800,100);
                
                // Recorte focado (Sniper)
                ctx.drawImage(video, sX, sY, sW, sH, 50, 10, 700, 80);
                
                // Preview real para o usuário
                preview.width = 800; preview.height = 100;
                preview.getContext('2d').drawImage(canvas, 0, 0);

                // Filtro para o Robô (Brilho maior para Albion/Traps)
                ctx.filter = 'grayscale(1) contrast(1.7) brightness(1.2)';
                ctx.drawImage(canvas, 0, 0);

                const result = await Tesseract.recognize(canvas, 'eng+por', { tessedit_pageseg_mode: '7' });
                let clean = normalize(result.data.text);
                
                // Filtro Sniper: Ignora padrões de erro e nomes curtos demais
                let words = clean.split(" ").filter(w => w.length >= 3 && !/^(TEA|TAA|THE|VST|ITY|LRI|PRI|PZA|OOL|FIXV|FLL|GYI|WGA|AAAA|RRRR|PMAA|SSTA|SZZM|JOD)$/.test(w));
                
                if (words.length >= 1 && words.join(" ").length >= 4) {
                    const fullName = words.join(" ");
                    // Evita match com repetição de letras (Zumbibuaaaa fix)
                    if (/([A-Z])\1{3,}/.test(fullName)) throw "Ruído detectado";

                    addLog("Lido: " + fullName);
                    const sorted = [...words].sort((a,b) => b.length - a.length);
                    await trySearchCascade(fullName, sorted);
                }
            } catch (e) {}

            isProcessing = false;
            setTimeout(() => requestAnimationFrame(loop), 500);
        }

        async function trySearchCascade(ocrFull, sorted) {
            for (let i = 0; i < Math.min(sorted.length, 2); i++) {
                let key = sorted[i];
                if (key.length < 4) continue;
                if (await searchAndMatch(ocrFull, key)) return;
                
                if (key.length >= 7) {
                    let frag = key.substring(0, 5);
                    if (await searchAndMatch(ocrFull, frag)) return;
                }
            }
        }

        async function searchAndMatch(ocrFull, key) {
            if (key !== lastSearch) {
                status.innerText = "⚡ BUSCANDO: " + key;
                try {
                    const [resPT, resEN] = await Promise.all([
                        fetch(`https://db.ygoprodeck.com/api/v7/cardinfo.php?fname=${encodeURIComponent(key)}&language=pt`),
                        fetch(`https://db.ygoprodeck.com/api/v7/cardinfo.php?fname=${encodeURIComponent(key)}`)
                    ]);
                    const dPT = await resPT.json(); const dEN = await resEN.json();
                    localCache = [...(dPT.data || []), ...(dEN.data || [])];
                    lastSearch = key;
                } catch (e) { return false; }
            }

            let best = null; let hi = 0;
            localCache.forEach(card => {
                let nPT = normalize(card.name);
                let nEN = card.name_en ? normalize(card.name_en) : normalize(card.name);
                let score = Math.max(calculateSimilarity(ocrFull, nPT), calculateSimilarity(ocrFull, nEN));
                
                if (nPT.includes(ocrFull) || ocrFull.includes(nPT)) score += 0.45;
                if (score > hi) { hi = score; best = card; }
            });

            if (hi > 0.72) {
                isPaused = true;
                if (window.navigator.vibrate) window.navigator.vibrate(70);
                mira.classList.add('active');
                addLog(`MATCH: ${best.name} (${Math.round(hi*100)}%)`);
                renderPopup(best);
                return true;
            }
            return false;
        }

        function calculateSimilarity(s1, s2) {
            let m = s1.length, n = s2.length;
            let d = Array.from({length: m + 1}, (_, i) => [i].concat(new Array(n).fill(0)));
            for(let j=1; j<=n; j++) d[0][j] = j;
            for(let i=1; i<=m; i++) {
                for(let j=1; j<=n; j++) {
                    let cost = s1[i-1] === s2[j-1] ? 0 : 1;
                    d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+cost);
                }
            }
            return (Math.max(m, n) - d[m][n]) / Math.max(m, n);
        }

        function renderPopup(card) {
            document.getElementById('card-popup').style.display = 'flex';
            document.getElementById('res-img').src = card.card_images[0].image_url;
            document.getElementById('res-name').innerText = card.name;
            document.getElementById('res-price').innerText = "Valor: $" + (card.card_prices[0].tcgplayer_price || "0.00");
        }

        window.onload = init;
    </script>
</body>
</html>
