<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>YGO Proxy Studio Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0c0c0c; color: #e0e0e0; text-align: center; padding: 20px; margin: 0; }
        .container { background: #1a1a1a; padding: 25px; border-radius: 15px; border: 1px solid #333; max-width: 1100px; margin: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.7); }
        h1 { color: #f1c40f; margin-bottom: 25px; text-transform: uppercase; font-size: 24px; letter-spacing: 1px; }
        .search-section { background: #222; padding: 20px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #444; text-align: left; }
        .field-group { display: flex; flex-direction: column; gap: 5px; position: relative; }
        .field-group label { font-size: 11px; color: #aaa; text-transform: uppercase; font-weight: bold; letter-spacing: 0.5px; }
        .row-layout { display: flex; gap: 15px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 20px; }
        input[type="text"], select { padding: 10px; border-radius: 5px; border: 1px solid #444; background: #111; color: white; font-size: 14px; height: 38px; box-sizing: border-box; }
        
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        .stepper { display: flex; align-items: center; background: #111; border: 1px solid #444; border-radius: 5px; height: 38px; overflow: hidden; width: fit-content; }
        .stepper button { background: #333; border: none; color: white; width: 30px; height: 100%; cursor: pointer; font-size: 18px; }
        .stepper input { width: 50px; border: none; background: transparent; color: white; text-align: center; font-size: 14px; outline: none; }
        
        .stepper input:not(:placeholder-shown) { border-bottom: 2px solid #f1c40f; }

        .suggestions-container { position: absolute; top: 100%; left: 0; right: 0; background: #252525; border-radius: 0 0 8px 8px; z-index: 9999; border: 2px solid #f1c40f; border-top: none; display: none; box-shadow: 0 20px 40px rgba(0,0,0,0.8); margin-top: 2px; }
        .suggestions-header { display: flex; justify-content: space-between; align-items: center; padding: 8px 15px; background: #333; }
        .close-suggestions { background: #e74c3c; color: white; border: none; border-radius: 4px; padding: 2px 10px; cursor: pointer; font-weight: bold; font-size: 10px; }
        .suggestions-list { max-height: 450px; overflow-y: auto; }
        
        /* Layout da Sugestão Ajustado */
        .suggestion-item { padding: 12px 15px; cursor: pointer; border-bottom: 1px solid #333; display: flex; align-items: center; gap: 20px; }
        .suggestion-item:hover { background: #3a3a3a; }
        .suggestion-item img { height: 100px; border-radius: 3px; border: 1px solid #444; }
        
        .card-info-box { 
            flex-grow: 1; 
            display: flex; 
            flex-direction: column; 
            gap: 6px; 
            text-align: left; 
            max-width: 300px;
        }

        .info-row { display: flex; justify-content: space-between; font-size: 12px; color: #bbb; align-items: center; }
        .info-row b { color: #f1c40f; }
        
        /* Estilo específico para a linha de ATK/DEF */
        .atk-def-row { 
            font-weight: bold; 
            font-size: 13px; 
            margin-top: 2px; 
            border-top: 1px solid #444; 
            padding-top: 4px; 
            color: #fff;
        }
        
        .no-results { padding: 40px 20px; text-align: center; color: #888; }
        .no-results b { color: #f1c40f; display: block; margin-bottom: 5px; }

        .btn-add { background: #555; color: #aaa; height: 38px; padding: 0 25px; border: none; border-radius: 5px; cursor: not-allowed; font-weight: bold; text-transform: uppercase; transition: 0.3s; }
        .btn-add.active { background: #27ae60; color: white; cursor: pointer; }
        .btn-clear { background: #c0392b; color: white; height: 38px; padding: 0 15px; border: none; border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: bold; }
        
        .upload-area { border: 2px dashed #444; padding: 20px; cursor: pointer; display: block; margin-bottom: 20px; background: #1a1a1a; border-radius: 10px; color: #888; }
        #preview-frame { width: 100%; height: 750px; border: 1px solid #444; border-radius: 8px; background: #222; margin-top: 20px; display: none; }
        #status { color: #f1c40f; font-weight: bold; margin-bottom: 10px; height: 20px; font-size: 14px; }
        .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; display: none; }
        button.main-btn { border: none; padding: 16px; font-weight: bold; cursor: pointer; border-radius: 8px; text-transform: uppercase; }
        #btn-update { background: #3498db; color: white; }
        #btn-download { background: #f1c40f; color: black; }
        
        .list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid #444; padding-bottom: 10px; }
        .btn-clear-list { background: #e67e22; color: white; border: none; padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; text-transform: uppercase; }
    </style>
</head>
<body>

<div class="container">
    <h1>YGO Proxy Studio Pro</h1>

    <div class="search-section">
        <div class="row-layout">
            <div class="field-group">
                <label>Tipo de Carta</label>
                <select id="filter-type" style="width: 180px;">
                    <option value="">Selecione...</option>
                    <option value="Monster">Monstro</option>
                    <option value="Spell Card">Magia</option>
                    <option value="Trap Card">Armadilha</option>
                </select>
            </div>
            <div class="field-group" id="group-subtype" style="display: none;">
                <label>Categoria</label>
                <select id="filter-subtype" style="width: 180px;"></select>
            </div>
            <div class="field-group" id="group-race" style="display: none;">
                <label>Tipo/Raça</label>
                <select id="filter-race" style="width: 180px;"></select>
            </div>
            <div class="field-group">
                <label>Escala (%)</label>
                <div class="stepper">
                    <button onclick="adjustScale(-0.1)">-</button>
                    <input type="number" id="print-scale" value="100.0" step="0.1" readonly>
                    <button onclick="adjustScale(0.1)">+</button>
                </div>
            </div>
            <button class="btn-clear" id="btn-reset" onclick="resetFilters()">Resetar Filtros</button>
        </div>

        <div id="monster-extras" class="row-layout" style="display: none;">
            <div class="field-group"><label>Atributo</label><select id="filter-attribute" style="width: 120px;"><option value="">Todos</option><option value="dark">Trevas</option><option value="light">Luz</option><option value="earth">Terra</option><option value="fire">Fogo</option><option value="water">Água</option><option value="wind">Vento</option><option value="divine">Divino</option></select></div>
            <div class="field-group"><label>Nível/Rank</label><select id="filter-lv" style="width: 100px;"><option value="">Todos</option></select></div>
            <div class="field-group"><label>Ataque (ATK)</label><div class="stepper"><button onclick="adjustVal('filter-atk', -50)">-</button><input type="number" id="filter-atk" placeholder="---"><button onclick="adjustVal('filter-atk', 50)">+</button></div></div>
            <div class="field-group"><label>Defesa (DEF)</label><div class="stepper"><button onclick="adjustVal('filter-def', -50)">-</button><input type="number" id="filter-def" placeholder="---"><button onclick="adjustVal('filter-def', 50)">+</button></div></div>
        </div>

        <div class="row-layout" style="border-top: 1px solid #444; padding-top: 20px; margin-bottom: 0;">
            <div class="field-group" style="flex: 2;">
                <label>Nome da Carta</label>
                <input type="text" id="search-input" placeholder="Busque pelo nome..." autocomplete="off">
                <div id="suggestions-container" class="suggestions-container">
                    <div class="suggestions-header">
                        <span style="font-size: 10px; font-weight: bold; color: #f1c40f;">RESULTADOS</span>
                        <button class="close-suggestions" onclick="closeSuggestions()">FECHAR X</button>
                    </div>
                    <div id="suggestions-list" class="suggestions-list"></div>
                </div>
            </div>
            <div class="field-group">
                <label>Quantidade</label>
                <div class="stepper">
                    <button onclick="document.getElementById('search-qty').stepDown()">-</button>
                    <input type="number" id="search-qty" value="1" min="1" readonly>
                    <button onclick="document.getElementById('search-qty').stepUp()">+</button>
                </div>
            </div>
            <button class="btn-add" id="btn-manual-add" style="flex: 0.5;">Selecione a carta</button>
        </div>
    </div>

    <label class="upload-area">📁 Importar .ydk (Decks) <input type="file" id="input" accept=".ydk" multiple style="display:none"></label>
    
    <div id="file-list" style="display:none; text-align: left; background: #111; padding: 15px; border-radius: 8px; border: 1px solid #333; margin-bottom: 20px;">
        <div class="list-header">
            <span style="color: #f1c40f; font-weight: bold; font-size: 12px;">CARTAS NA FILA</span>
            <button class="btn-clear-list" onclick="clearFullQueue()">Limpar Lista</button>
        </div>
        <div id="queue-items"></div>
    </div>

    <div id="status"></div>
    <div id="actions-bar" class="actions">
        <button id="btn-update" class="main-btn">Atualizar Prévia</button>
        <button id="btn-download" class="main-btn">Baixar PDF HQ</button>
    </div>
    <iframe id="preview-frame"></iframe>
</div>

<script>
    const { jsPDF } = window.jspdf;
    let cardQueue = []; 
    let selectedManualCard = null;
    let currentPdfBlob = null;
    let searchTimeout = null;

    const tradSubtypes = { "Normal Monster": "Monstro Normal", "Effect Monster": "Monstro de Efeito", "Fusion Monster": "Monstro de Fusão", "Synchro Monster": "Monstro Synchro", "XYZ Monster": "Monstro Xyz", "Link Monster": "Monstro Link" };
    const tradRaces = { "Aqua": "Aqua", "Beast": "Besta", "Beast-Warrior": "Besta-Guerreira", "Cyberse": "Ciberso", "Dinosaur": "Dinossauro", "Divine-Beast": "Besta Divina", "Dragon": "Dragão", "Fiend": "Demônio", "Fish": "Peixe", "Insect": "Inseto", "Machine": "Máquina", "Plant": "Planta", "Psychic": "Psíquico", "Pyro": "Piro", "Reptile": "Réptil", "Rock": "Rocha", "Sea Serpent": "Serpente Marinha", "Spellcaster": "Mago", "Thunder": "Trovão", "Warrior": "Guerreiro", "Winged Beast": "Besta Alada", "Wyrm": "Wyrm", "Zombie": "Zumbi", "Normal": "Normal", "Continuous": "Contínua", "Field": "Campo", "Equip": "Equipamento", "Quick-Play": "Rápida", "Ritual": "Ritual", "Counter": "Resposta" };
    const rawRaces = { "Monster": ["Aqua", "Beast", "Beast-Warrior", "Cyberse", "Dinosaur", "Divine-Beast", "Dragon", "Fiend", "Fish", "Insect", "Machine", "Plant", "Psychic", "Pyro", "Reptile", "Rock", "Sea Serpent", "Spellcaster", "Thunder", "Warrior", "Winged Beast", "Wyrm", "Zombie"], "Spell Card": ["Normal", "Continuous", "Field", "Equip", "Quick-Play", "Ritual"], "Trap Card": ["Normal", "Continuous", "Counter"] };

    const lvSelect = document.getElementById('filter-lv');
    for(let i=0; i<=13; i++) { let opt = document.createElement('option'); opt.value = i; opt.textContent = i; lvSelect.appendChild(opt); }

    function adjustVal(id, amount) { 
        const el = document.getElementById(id); 
        let currentVal = el.value;
        if (currentVal === "") {
            if (amount > 0) el.value = 0;
        } else {
            let newVal = parseInt(currentVal) + amount;
            if (newVal < 0) el.value = "";
            else el.value = newVal;
        }
        triggerAutoSearch(); 
    }
    
    function adjustScale(amount) { 
        const el = document.getElementById('print-scale'); 
        el.value = (parseFloat(el.value) + amount).toFixed(1); 
    }
    
    function closeSuggestions() { document.getElementById('suggestions-container').style.display = "none"; }
    
    function toggleAddButton(active) {
        const btn = document.getElementById('btn-manual-add');
        if(active) {
            btn.classList.add('active');
            btn.innerText = "Adicionar"; // Texto quando uma carta é selecionada
        } else {
            btn.classList.remove('active');
            btn.innerText = "Selecione a carta"; // Texto quando está desabilitado
        }
    }

    function resetFilters() {
        document.getElementById('filter-type').value = "";
        document.getElementById('filter-type').dispatchEvent(new Event('change'));
        document.getElementById('filter-atk').value = "";
        document.getElementById('filter-def').value = "";
        document.getElementById('filter-attribute').value = "";
        document.getElementById('filter-lv').value = "";
        document.getElementById('search-input').value = "";
        document.getElementById('search-qty').value = "1";
        selectedManualCard = null;
        toggleAddButton(false);
        closeSuggestions();
        document.getElementById('status').innerText = "";
    }

    function triggerAutoSearch() {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(performSearch, 500);
    }

    const fields = ['filter-type', 'filter-subtype', 'filter-race', 'filter-attribute', 'filter-lv', 'filter-atk', 'filter-def'];
    fields.forEach(id => document.getElementById(id).addEventListener('change', triggerAutoSearch));
    document.getElementById('search-input').addEventListener('input', triggerAutoSearch);

    async function performSearch() {
        const query = document.getElementById('search-input').value.trim();
        const type = document.getElementById('filter-type').value;
        const subtype = document.getElementById('filter-subtype').value;
        const race = document.getElementById('filter-race').value;
        const attr = document.getElementById('filter-attribute').value;
        const lv = document.getElementById('filter-lv').value;
        const atk = document.getElementById('filter-atk').value;
        const def = document.getElementById('filter-def').value;

        if (query.length === 0 && !type && atk === "" && def === "") { closeSuggestions(); return; }

        try {
            document.getElementById('status').innerText = "Buscando...";
            let params = new URLSearchParams();
            params.append('language', 'pt');
            if (query.length > 0) params.append('fname', query);
            if (type) {
                if (type === "Monster") { if (subtype) params.append('type', subtype); } 
                else { params.append('type', type); }
            }
            if (type === "Monster" || (!type && (atk !== "" || def !== ""))) {
                if (race) params.append('race', race);
                if (attr) params.append('attribute', attr);
                if (lv) params.append('level', lv);
                if (atk !== "") params.append('atk', atk);
                if (def !== "") params.append('def', def);
            } else if (race) { params.append('race', race); }

            const res = await fetch(`https://db.ygoprodeck.com/api/v7/cardinfo.php?${params.toString()}`);
            const data = await res.json();

            const listEl = document.getElementById('suggestions-list');
            document.getElementById('suggestions-container').style.display = "block";
            listEl.innerHTML = "";

            if (data.data) {
                let results = data.data;
                if (type === "Monster" && !subtype) results = results.filter(c => c.type.toLowerCase().includes("monster"));
                
                results.slice(0, 30).forEach(card => {
                    card.card_images.forEach((img, idx) => {
                        const div = document.createElement('div');
                        div.className = 'suggestion-item';
                        
                        // Formatação dos dados
                        const cardAttr = card.attribute || (card.type.includes("Spell") ? "MAGIA" : "ARMADILHA");
                        const cardLv = card.level ? `Nível ${card.level}` : (card.rank ? `Rank ${card.rank}` : (card.linkval ? `Link-${card.linkval}` : "---"));
                        const cardRace = tradRaces[card.race] || card.race;
                        const cardAtk = card.atk !== undefined ? `ATK/ ${card.atk}` : "";
                        const cardDef = card.def !== undefined ? `DEF/ ${card.def}` : (card.linkval ? `LINK/ ${card.linkval}` : "");

                        // Novo layout em 3 linhas
                        div.innerHTML = `
                            <img src="${img.image_url_small}">
                            <div class="card-info-box">
                                <b style="color:#f1c40f; font-size: 15px;">${card.name}</b>
                                
                                <div class="info-row">
                                    <span style="flex: 1; text-align: left; font-weight: bold;">${cardAttr}</span>
                                    <span style="flex: 1; text-align: center;">${cardLv}</span>
                                    <span style="flex: 1; text-align: right;">${cardRace}</span>
                                </div>

                                <div class="info-row atk-def-row">
                                    <span style="flex: 1; text-align: left;">${cardAtk}</span>
                                    <span style="flex: 1; text-align: right;">${cardDef}</span>
                                    ${(!cardAtk && !cardDef) ? `<small style="color:#666; width: 100%; text-align: center;">Arte #${idx+1}</small>` : ''}
                                </div>
                            </div>`;
                        
                        div.onclick = () => {
                            selectedManualCard = { id: card.id, name: card.name, imgId: img.id };
                            document.getElementById('search-input').value = card.name;
                            toggleAddButton(true); closeSuggestions();
                        };
                        listEl.appendChild(div);
                    });
                });
            } else {
                listEl.innerHTML = `<div class="no-results"><b>Nenhuma carta encontrada</b><small>Tente mudar o nome ou ajustar os filtros.</small></div>`;
            }
            document.getElementById('status').innerText = "";
        } catch (e) { document.getElementById('status').innerText = ""; }
    }

    document.getElementById('filter-type').addEventListener('change', function() {
        const val = this.value;
        const groupSub = document.getElementById('group-subtype'); const groupRc = document.getElementById('group-race');
        const filterSub = document.getElementById('filter-subtype'); const filterRc = document.getElementById('filter-race');
        filterSub.innerHTML = '<option value="">Qualquer</option>'; filterRc.innerHTML = '<option value="">Qualquer</option>';
        if (val) {
            if(val === "Monster") {
                Object.keys(tradSubtypes).forEach(c => { const opt = document.createElement('option'); opt.value = c; opt.textContent = tradSubtypes[c]; filterSub.appendChild(opt); });
                groupSub.style.display = "flex";
            } else groupSub.style.display = "none";
            rawRaces[val].forEach(r => { const opt = document.createElement('option'); opt.value = r; opt.textContent = tradRaces[r] || r; filterRc.appendChild(opt); });
            groupRc.style.display = "flex";
            document.getElementById('monster-extras').style.display = (val === "Monster") ? "flex" : "none";
        } else { groupSub.style.display = "none"; groupRc.style.display = "none"; document.getElementById('monster-extras').style.display = "none"; }
    });

    document.getElementById('btn-manual-add').onclick = () => {
        if (!selectedManualCard) return;
        const qty = parseInt(document.getElementById('search-qty').value);
        for(let i=0; i<qty; i++) { cardQueue.push({ ...selectedManualCard, instanceId: Date.now() + Math.random() }); }
        renderQueue(); generatePreview();
        document.getElementById('search-input').value = ""; toggleAddButton(false);
    };

    function renderQueue() {
        const listEl = document.getElementById('file-list');
        const itemsEl = document.getElementById('queue-items');
        itemsEl.innerHTML = "";
        if (cardQueue.length > 0) {
            listEl.style.display = "block";
            const orderMap = new Map();
            cardQueue.forEach(card => {
                if(!orderMap.has(card.imgId)) orderMap.set(card.imgId, { name: card.name, qty: 0 });
                orderMap.get(card.imgId).qty++;
            });
            orderMap.forEach((data, id) => {
                itemsEl.innerHTML += `
                    <div style="padding:5px; border-bottom:1px solid #333; display:flex; justify-content:space-between; align-items:center;">
                        <span><b>${data.qty}x</b> ${data.name}</span>
                        <span style="color:#e74c3c; cursor:pointer; font-size:10px; font-weight:bold;" onclick="remove('${id}')">[X]</span>
                    </div>`;
            });
        } else listEl.style.display = "none";
    }

    window.remove = (imgId) => { 
        cardQueue = cardQueue.filter(c => c.imgId != imgId); 
        renderQueue(); if(cardQueue.length > 0) generatePreview(); else clearPreview();
    };

    window.clearFullQueue = () => { if(confirm("Limpar tudo?")) { cardQueue = []; renderQueue(); clearPreview(); } };

    function clearPreview() {
        document.getElementById('preview-frame').style.display = "none";
        document.getElementById('actions-bar').style.display = "none";
        currentPdfBlob = null;
    }

    async function generatePreview() {
        if (cardQueue.length === 0) return;
        const status = document.getElementById('status');
        status.innerText = "Gerando PDF...";
        const doc = new jsPDF({ orientation: "landscape", unit: "mm", format: "a4" });
        const scale = parseFloat(document.getElementById('print-scale').value) / 100;
        const w = 59 * scale, h = 86 * scale, gap = 6;
        const mx = (297 - (4 * w + 3 * gap)) / 2;
        const my = (210 - (2 * h + 1 * gap)) / 2;
        const totalPages = Math.ceil(cardQueue.length / 8);

        for (let i = 0; i < cardQueue.length; i++) {
            if (i % 8 === 0 && i > 0) doc.addPage();
            if (i % 8 === 0) {
                doc.setFillColor(30, 30, 30); doc.rect(0, 0, 297, 210, 'F');
                doc.setFontSize(16); doc.setTextColor(255);
                doc.text("Imprimir no tamanho real", 148.5, 7, { align: "center" });
                doc.setFontSize(12);
                doc.text(`Página ${Math.floor(i / 8) + 1} de ${totalPages}`, 270, 200, { align: "right" });
            }
            const pos = i % 8; const col = pos % 4; const row = Math.floor(pos / 4);
            const x = mx + (col * (w + gap)); const y = my + (row * (h + gap));
            try {
                const imgUrl = `https://images.weserv.nl/?url=images.ygoprodeck.com/images/cards/${cardQueue[i].imgId}.jpg&q=100`;
                const resp = await fetch(imgUrl);
                const blob = await resp.blob();
                const b64 = await new Promise(r => { const rd = new FileReader(); rd.onloadend = () => r(rd.result); rd.readAsDataURL(blob); });
                doc.addImage(b64, 'JPEG', x, y, w, h);
                doc.setDrawColor(255); doc.setLineWidth(0.4);
                const offset = 2; const len = 5;
                doc.line(x-offset, y, x-offset-len, y); doc.line(x, y-offset, x, y-offset-len);
                doc.line(x+w+offset, y, x+w+offset+len, y); doc.line(x+w, y-offset, x+w, y-offset-len);
                doc.line(x-offset, y+h, x-offset-len, y+h); doc.line(x, y+h+offset, x, y+h+offset+len);
                doc.line(x+w+offset, y+h, x+w+offset+len, y+h); doc.line(x+w, y+h+offset, x+w, y+h+offset+len);
            } catch (e) {}
        }
        currentPdfBlob = doc.output('blob');
        document.getElementById('preview-frame').src = URL.createObjectURL(currentPdfBlob);
        document.getElementById('preview-frame').style.display = "block";
        document.getElementById('actions-bar').style.display = "grid";
        status.innerText = "PDF Renderizado!";
    }

    document.getElementById('btn-download').onclick = () => {
        if (!currentPdfBlob) return;
        const agora = new Date();
        const dia = String(agora.getDate()).padStart(2, '0');
        const mes = String(agora.getMonth() + 1).padStart(2, '0');
        const ano = agora.getFullYear();
        const dataFormatada = `${dia}-${mes}-${ano}`;
        const link = document.createElement('a');
        link.href = URL.createObjectURL(currentPdfBlob);
        link.download = `Cartas_Proxies_Yu-Gi-Oh_${dataFormatada}.pdf`;
        link.click();
    };

    document.getElementById('btn-update').onclick = generatePreview;
    document.getElementById('input').addEventListener('change', async (e) => {
        const files = Array.from(e.target.files);
        for (const f of files) {
            const t = await f.text();
            const ids = t.split('\n').map(l=>l.trim()).filter(l=>l && !isNaN(l) && !l.startsWith('#') && !l.startsWith('!'));
            for (const id of ids) cardQueue.push({ id, name: "ID: "+id, imgId: id });
        }
        renderQueue(); generatePreview();
    });
</script>
