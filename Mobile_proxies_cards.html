<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YGO Proxy Studio Pro - Workspace V3.7</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --bg-dark: #0c0c0c;
            --panel-bg: #1a1a1a;
            --accent: #f1c40f;
            --border: #333;
            --text: #e0e0e0;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background: var(--bg-dark); 
            color: var(--text); 
            margin: 0; 
            height: 100vh;
            overflow: hidden; 
        }

        /* --- ESTRUTURA BASE (DESKTOP) --- */
        .app-container {
            display: grid;
            grid-template-columns: 300px 1fr 450px;
            height: 100vh;
            gap: 1px;
            background: var(--border);
            transition: grid-template-columns 0.3s ease;
        }

        .app-container.empty-queue { grid-template-columns: 300px 1fr 0px; }
        .col { background: var(--bg-dark); display: flex; flex-direction: column; overflow: hidden; }
        
        .col-header { 
            padding: 12px 15px; 
            background: var(--panel-bg); 
            border-bottom: 1px solid var(--border); 
            font-size: 11px; 
            font-weight: bold; 
            color: var(--accent); 
            display: flex; 
            justify-content: space-between;
            align-items: center;
            text-transform: uppercase;
        }

        .sidebar-content { padding: 15px; overflow-y: auto; flex-grow: 1; }
        .filter-group { margin-bottom: 12px; display: flex; flex-direction: column; gap: 4px; }
        .filter-group label { font-size: 10px; color: #888; text-transform: uppercase; font-weight: bold; }
        
        select, input { background: #111; border: 1px solid #444; color: white; padding: 8px; border-radius: 4px; font-size: 13px; width: 100%; box-sizing: border-box; }
        
        .btn-secondary { 
            display: block; 
            background: #333; 
            color: white; 
            width: 100%; 
            padding: 10px; 
            border-radius: 4px; 
            cursor: pointer; 
            text-align: center; 
            border: 1px solid #444; 
            font-size: 11px; 
            font-weight: bold;
            box-sizing: border-box;
            text-transform: uppercase;
        }

        .stepper { display: flex; border: 1px solid #444; border-radius: 4px; overflow: hidden; height: 35px; background: #111; }
        .stepper button { background: #333; color: white; border: none; width: 35px; cursor: pointer; font-size: 18px; font-weight: bold; }
        .stepper input { border: none !important; text-align: center; width: 100%; background: transparent; }

        .search-area { background: #111; padding: 15px; border-bottom: 1px solid var(--border); }
        .view-controls { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: #181818; border-bottom: 1px solid #333; }
        
        .btn-view { background: #333; color: #888; border: 1px solid #444; padding: 5px 10px; cursor: pointer; border-radius: 4px; font-size: 11px; }
        .btn-view.active { background: var(--accent); color: black; border-color: var(--accent); }

        .results-view { flex-grow: 1; overflow-y: auto; }

        .suggestion-item { display: flex; gap: 12px; padding: 15px 10px; background: var(--bg-dark); align-items: flex-start; cursor: pointer; border-bottom: 1px solid #222; }
        .suggestion-item img { height: 110px; border-radius: 4px; border: 1px solid #444; flex-shrink: 0; box-shadow: 0 4px 8px rgba(0,0,0,0.6); }

        .card-info-box { flex-grow: 1; display: flex; flex-direction: column; gap: 5px; text-align: left; }
        .card-name { color: var(--accent); font-size: 13px; font-weight: bold; }
        .info-row { display: flex; justify-content: space-between; font-size: 11px; color: #999; }
        .atk-def-row { font-weight: bold; font-size: 11px; border-top: 1px solid #222; margin-top: 5px; padding-top: 5px; color: #fff; }

        .deck-list { height: 350px; overflow-y: auto; padding: 10px; background: #080808; border-bottom: 1px solid var(--border); }
        .pdf-preview-container { flex-grow: 1; background: #222; position: relative; overflow: hidden; min-height: 300px; }
        #preview-frame { width: 100%; height: 100%; border: none; }
        .btn-accent { background: var(--accent); color: black; width: 100%; padding: 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; text-transform: uppercase; }

        .pagination-bar { padding: 8px; background: var(--panel-bg); display: flex; justify-content: center; gap: 10px; align-items: center; border-top: 1px solid var(--border); }
        .page-input { width: 50px; text-align: center; background: #000; border: 1px solid #444; color: var(--accent); }

        /* --- EXCLUSIVO DESKTOP --- */
        @media (min-width: 901px) {
            .list-mode { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1px; background: #222; }
            .grid-mode { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; padding: 15px; }
            .grid-mode .card-info-box { display: none; }
            .grid-mode .suggestion-item { display: block; text-align: center; }
            .grid-mode .suggestion-item img { width: 100%; height: auto; }
        }

        /* --- BLOCO MOBILE (V3.7) --- */
        @media (max-width: 900px) {
            body { overflow-y: auto !important; height: auto !important; }
            .app-container, .app-container.empty-queue { 
                display: block !important; 
                height: auto !important; 
            }
            .col { 
                width: 100% !important; 
                height: auto !important; 
                overflow: visible !important;
                border-bottom: 2px solid var(--border); 
            }
            .results-view { 
                height: 550px; 
                overflow-y: auto;
            }
            /* OCULTA O PREVIEW DO PDF NO MOBILE */
            .pdf-preview-container { display: none !important; }
            
            #col-preview { margin-top: 20px; }
            .deck-list { height: 250px; }
        }
    </style>
</head>
<body>

<div class="app-container empty-queue" id="app-layout">
    <div class="col">
        <div class="col-header"><span>Filtros</span><button class="btn-view" onclick="resetFilters()">Resetar</button></div>
        <div class="sidebar-content">
            <div class="filter-group"><label>Tipo de Carta</label>
                <select id="filter-type">
                    <option value="">Selecione...</option>
                    <option value="Monster">Monstro</option>
                    <option value="Spell Card">Magia</option>
                    <option value="Trap Card">Armadilha</option>
                </select>
            </div>
            <div id="group-subtype" class="filter-group" style="display:none"><label>Categoria</label><select id="filter-subtype"></select></div>
            <div id="group-race" class="filter-group" style="display:none"><label>Raça/Tipo</label><select id="filter-race"></select></div>
            <div id="monster-extras" style="display:none">
                <div class="filter-group"><label>Atributo</label><select id="filter-attribute"><option value="">Todos</option><option value="dark">Trevas</option><option value="light">Luz</option><option value="earth">Terra</option><option value="fire">Fogo</option><option value="water">Água</option><option value="wind">Vento</option><option value="divine">Divino</option></select></div>
                <div class="filter-group"><label>Nível</label><select id="filter-lv"><option value="">Todos</option></select></div>
                <div class="filter-group"><label>ATK</label><div class="stepper"><button onclick="adjustVal('filter-atk', -50)">-</button><input type="number" id="filter-atk" placeholder="---"><button onclick="adjustVal('filter-atk', 50)">+</button></div></div>
                <div class="filter-group"><label>DEF</label><div class="stepper"><button onclick="adjustVal('filter-def', -50)">-</button><input type="number" id="filter-def" placeholder="---"><button onclick="adjustVal('filter-def', 50)">+</button></div></div>
            </div>
            <div class="filter-group" style="margin-top:20px;"><label>Escala do PDF (%)</label><div class="stepper"><button onclick="adjustScale(-0.1)">-</button><input type="number" id="print-scale" value="100.0" readonly><button onclick="adjustScale(0.1)">+</button></div></div>
            <hr style="border:0; border-top:1px solid #333; margin: 20px 0;">
            <label class="btn-secondary">IMPORTAR .YDK<input type="file" id="file-ydk" accept=".ydk" style="display:none" onchange="importYDK(this)"></label>
        </div>
    </div>

    <div class="col">
        <div class="search-area">
            <div style="display: flex; gap: 10px;">
                <input type="text" id="search-input" placeholder="Buscar pelo nome...">
                <div class="stepper" style="width: 100px;">
                    <button onclick="document.getElementById('search-qty').stepDown()">-</button>
                    <input type="number" id="search-qty" value="1" min="1" readonly>
                    <button onclick="document.getElementById('search-qty').stepUp()">+</button>
                </div>
            </div>
        </div>
        <div class="view-controls">
            <span id="result-info" style="font-size: 11px; color: #888;">Carregando...</span>
            <div style="display: flex; gap: 5px;">
                <button id="btn-list" class="btn-view active" onclick="changeView('list')">LISTA</button>
                <button id="btn-grid" class="btn-view" onclick="changeView('grid')">GRADE</button>
            </div>
        </div>
        <div id="results-view" class="results-view list-mode"></div>
        <div class="pagination-bar">
            <button class="btn-view" onclick="changePage(-1)">◄</button>
            <div style="display: flex; align-items: center; gap: 5px;">
                <input type="number" id="page-jump" class="page-input" value="1" min="1" onchange="jumpToPage(this.value)">
                <span id="page-total" style="font-size: 11px; color: #888;">/ 1</span>
            </div>
            <button class="btn-view" onclick="changePage(1)">►</button>
        </div>
    </div>

    <div class="col" id="col-preview">
        <div class="col-header"><span>Fila (<span id="count-total">0</span>)</span><button class="btn-view" onclick="clearQueue()" style="font-size: 9px;">Limpar</button></div>
        <div class="deck-list" id="deck-items"></div>
        <div class="pdf-preview-container">
            <div id="import-overlay" style="position: absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:none; flex-direction:column; justify-content:center; align-items:center; z-index:10;"><span style="color:var(--accent); font-size:11px;">GERANDO PDF...</span><div style="width:80%; height:4px; background:#333; margin-top:10px;"><div id="progress-bar" style="width:0; height:100%; background:var(--accent);"></div></div></div>
            <iframe id="preview-frame"></iframe>
        </div>
        <div style="padding: 10px; background: #111;"><button class="btn-accent" onclick="downloadPDF()">BAIXAR PDF HQ</button></div>
    </div>
</div>

<script>
    const { jsPDF } = window.jspdf;
    let cardQueue = [], searchResults = [], currentPage = 1, currentView = 'list';
    let isGenerating = false;

    function getItemsPerPage() {
        if (window.innerWidth < 900) return 15;
        const isQueueEmpty = cardQueue.length === 0;
        return currentView === 'list' ? (isQueueEmpty ? 25 : 15) : (isQueueEmpty ? 44 : 21);
    }

    const trad = { "DARK": "TREVAS", "LIGHT": "LUZ", "EARTH": "TERRA", "FIRE": "FOGO", "WATER": "ÁGUA", "WIND": "VENTO", "DIVINE": "DIVINO" };
    for(let i=0; i<=13; i++) document.getElementById('filter-lv').innerHTML += `<option value="${i}">${i}</option>`;

    window.onload = () => { performSearch(true); };

    function changeView(view) {
        currentView = view;
        document.getElementById('btn-list').classList.toggle('active', view === 'list');
        document.getElementById('btn-grid').classList.toggle('active', view === 'grid');
        currentPage = 1; renderResults();
    }

    function adjustVal(id, amount) {
        const el = document.getElementById(id);
        let val = (parseInt(el.value) || 0) + amount;
        el.value = val < 0 ? "" : val; triggerSearch();
    }

    function adjustScale(amount) {
        const el = document.getElementById('print-scale');
        el.value = (parseFloat(el.value) + amount).toFixed(1); triggerPDFUpdate();
    }

    document.getElementById('filter-type').onchange = function() {
        const v = this.value;
        const fSub = document.getElementById('filter-subtype'), fRace = document.getElementById('filter-race');
        fSub.innerHTML = fRace.innerHTML = '<option value="">Qualquer</option>';
        document.getElementById('group-subtype').style.display = (v === "Monster" ? "flex" : "none");
        document.getElementById('monster-extras').style.display = (v === "Monster" ? "block" : "none");
        if(v) {
            if(v === "Monster") ["Normal Monster", "Effect Monster", "Fusion Monster", "Synchro Monster", "XYZ Monster", "Link Monster"].forEach(k => fSub.innerHTML += `<option value="${k}">${k}</option>`);
            const rawRaces = { "Monster": ["Aqua", "Beast", "Beast-Warrior", "Cyberse", "Dinosaur", "Dragon", "Fiend", "Fish", "Insect", "Machine", "Plant", "Psychic", "Pyro", "Reptile", "Rock", "Sea Serpent", "Spellcaster", "Thunder", "Warrior", "Winged Beast", "Wyrm", "Zombie"], "Spell Card": ["Normal", "Continuous", "Field", "Equip", "Quick-Play", "Ritual"], "Trap Card": ["Normal", "Continuous", "Counter"] };
            rawRaces[v].forEach(r => fRace.innerHTML += `<option value="${r}">${r}</option>`);
            document.getElementById('group-race').style.display = "flex";
        } else { document.getElementById('group-race').style.display = "none"; }
        triggerSearch();
    };

    const inputFields = ['search-input', 'filter-subtype', 'filter-race', 'filter-attribute', 'filter-lv', 'filter-atk', 'filter-def'];
    inputFields.forEach(id => document.getElementById(id).addEventListener('input', triggerSearch));

    function triggerSearch() { clearTimeout(window.sTimeout); window.sTimeout = setTimeout(performSearch, 500); }

    async function performSearch(initial = false) {
        const q = document.getElementById('search-input').value;
        const type = document.getElementById('filter-type').value;
        const sub = document.getElementById('filter-subtype').value;
        const atk = document.getElementById('filter-atk').value;
        const def = document.getElementById('filter-def').value;
        if(!initial && q.length < 2 && !type && !atk && !def) return;
        let p = new URLSearchParams({ language: 'pt' });
        if(q) p.append('fname', q);
        if(type) { if(type === "Monster" && sub) p.append('type', sub); else if(type !== "Monster") p.append('type', type); }
        const race = document.getElementById('filter-race').value; if(race) p.append('race', race);
        if(atk) p.append('atk', atk); if(def) p.append('def', def);
        if(document.getElementById('filter-lv').value) p.append('level', document.getElementById('filter-lv').value);
        if(document.getElementById('filter-attribute').value) p.append('attribute', document.getElementById('filter-attribute').value);
        try {
            const res = await fetch(`https://db.ygoprodeck.com/api/v7/cardinfo.php?${p.toString()}`);
            const data = await res.json();
            let rawData = data.data || [];
            if(type === "Monster" && !sub) rawData = rawData.filter(c => c.type.toLowerCase().includes("monster"));
            searchResults = rawData; currentPage = 1; renderResults();
        } catch(e) { searchResults = []; renderResults(); }
    }

    function renderResults() {
        const container = document.getElementById('results-view'); container.innerHTML = "";
        container.className = `results-view ${currentView}-mode`;
        const items = getItemsPerPage();
        const start = (currentPage - 1) * items;
        const pageItems = searchResults.slice(start, start + items);
        const totalPages = Math.ceil(searchResults.length / items) || 1;
        document.getElementById('result-info').innerText = `Exibindo ${start + 1}-${Math.min(start + items, searchResults.length)} de ${searchResults.length}`;
        document.getElementById('page-total').innerText = `/ ${totalPages}`;
        document.getElementById('page-jump').value = currentPage;
        pageItems.forEach(card => {
            const div = document.createElement('div'); div.className = 'suggestion-item';
            const attrTrad = trad[card.attribute] || (card.type.includes("Spell") ? "MAGIA" : "ARMADILHA");
            div.innerHTML = `<img src="${card.card_images[0].image_url_small}"><div class="card-info-box"><b class="card-name">${card.name}</b><div class="info-row"><span style="color:#eee">${attrTrad}</span><span>${card.level ? 'LV '+card.level : ''}</span></div><div class="info-row" style="color:var(--accent)"><span>${card.race}</span></div>${card.atk !== undefined ? `<div class="info-row atk-def-row"><span>ATK/ ${card.atk}</span><span>DEF/ ${card.def}</span></div>` : ''}</div>`;
            div.onclick = () => {
                const qty = parseInt(document.getElementById('search-qty').value);
                for(let i=0; i<qty; i++) cardQueue.push({ id: card.id, name: card.name, imgId: card.card_images[0].id });
                updateUI(); renderResults(); 
            };
            container.appendChild(div);
        });
    }

    function updateUI() {
        const list = document.getElementById('deck-items');
        const layout = document.getElementById('app-layout');
        if(cardQueue.length === 0) layout.classList.add('empty-queue'); else layout.classList.remove('empty-queue');
        list.innerHTML = "";
        const counts = {};
        cardQueue.forEach(c => counts[c.imgId] = (counts[c.imgId] || 0) + 1);
        Object.keys(counts).forEach(id => {
            const c = cardQueue.find(x => x.imgId == id);
            list.innerHTML += `<div style="padding:8px; border-bottom:1px solid #222; font-size:11px; display:flex; justify-content:space-between; align-items:center;"><span><b>${counts[id]}x</b> ${c.name}</span><span style="color:red; cursor:pointer; font-weight:bold;" onclick="removeItem('${id}')">✖</span></div>`;
        });
        document.getElementById('count-total').innerText = cardQueue.length; triggerPDFUpdate();
    }

    function triggerPDFUpdate() { if(isGenerating || cardQueue.length === 0) return; generatePDF(); }

    async function generatePDF() {
        if(isGenerating) return; isGenerating = true;
        document.getElementById('import-overlay').style.display = 'flex';
        const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
        const scale = parseFloat(document.getElementById('print-scale').value) / 100;
        const w = 59 * scale, h = 86 * scale, gap = 6;
        const mx = (297 - (4 * w + 3 * gap)) / 2; const my = (210 - (2 * h + 1 * gap)) / 2;
        const totalPages = Math.ceil(cardQueue.length / 8);
        
        for(let i=0; i<cardQueue.length; i++) {
            if (i % 8 === 0 && i > 0) doc.addPage();
            if (i % 8 === 0) {
                doc.setFillColor(30, 30, 30); doc.rect(0, 0, 297, 210, 'F');
                doc.setTextColor(255); doc.setFontSize(16); doc.text("Imprimir no tamanho real", 148.5, 7, { align: "center" });
                doc.setTextColor(241, 196, 15); doc.setFontSize(12); doc.text(`Página ${Math.floor(i / 8) + 1} de ${totalPages}`, 270, 200, { align: "right" });
            }
            const pos = i % 8, col = pos % 4, row = Math.floor(pos / 4);
            const x = mx + (col * (w + gap)), y = my + (row * (h + gap));
            document.getElementById('progress-bar').style.width = Math.round(((i + 1) / cardQueue.length) * 100) + '%';
            try {
                const imgUrl = `https://images.weserv.nl/?url=images.ygoprodeck.com/images/cards/${cardQueue[i].imgId}.jpg&q=100`;
                const resp = await fetch(imgUrl); const blob = await resp.blob();
                const b64 = await new Promise(r => { const rd = new FileReader(); rd.onloadend = () => r(rd.result); rd.readAsDataURL(blob); });
                doc.addImage(b64, 'JPEG', x, y, w, h);
                doc.setDrawColor(255); doc.setLineWidth(0.4); const offset = 2, len = 5;
                doc.line(x-offset, y, x-offset-len, y); doc.line(x, y-offset, x, y-offset-len);
                doc.line(x+w+offset, y, x+w+offset+len, y); doc.line(x+w, y-offset, x+w, y-offset-len);
                doc.line(x-offset, y+h, x-offset-len, y+h); doc.line(x, y+h+offset, x, y+h+offset+len);
                doc.line(x+w+offset, y+h, x+w+offset+len, y+h); doc.line(x+w, y+h+offset, x+w, y+h+offset+len);
            } catch(e) {}
        }
        window.currentPdf = doc.output('blob');
        document.getElementById('preview-frame').src = URL.createObjectURL(window.currentPdf);
        document.getElementById('import-overlay').style.display = 'none'; isGenerating = false;
    }

    window.removeItem = (id) => { cardQueue = cardQueue.filter(c => c.imgId != id); updateUI(); renderResults(); };
    window.clearQueue = () => { if(confirm("Limpar tudo?")) { cardQueue = []; updateUI(); renderResults(); } };
    window.changePage = (dir) => { 
        const max = Math.ceil(searchResults.length/getItemsPerPage());
        if((currentPage + dir) > 0 && (currentPage + dir) <= max) { currentPage += dir; renderResults(); }
    };
    window.jumpToPage = (val) => { 
        const max = Math.ceil(searchResults.length/getItemsPerPage());
        currentPage = Math.max(1, Math.min(max, parseInt(val) || 1)); renderResults(); 
    };
    window.downloadPDF = () => { 
        if(window.currentPdf) { 
            const agora = new Date(); const dataF = `${String(agora.getDate()).padStart(2, '0')}-${String(agora.getMonth() + 1).padStart(2, '0')}-${agora.getFullYear()}`;
            const a = document.createElement('a'); a.href = URL.createObjectURL(window.currentPdf); 
            a.download = `Cartas_Proxies_Yu-Gi-Oh!_${dataF}.pdf`; a.click(); 
        } 
    };
    window.importYDK = async (input) => {
        const file = input.files[0]; if(!file) return; const text = await file.text();
        const ids = text.split('\n').map(l => l.trim()).filter(l => /^\d+$/.test(l));
        const res = await fetch(`https://db.ygoprodeck.com/api/v7/cardinfo.php?id=${ids.join(',')}`);
        const data = await res.json();
        if(data.data) {
            data.data.forEach(card => {
                const count = ids.filter(id => id == card.id).length;
                for(let i=0; i<count; i++) cardQueue.push({ id: card.id, name: card.name, imgId: card.card_images[0].id });
            });
            updateUI(); renderResults();
        }
    };
    window.resetFilters = () => {
        document.getElementById('search-input').value = ""; document.getElementById('filter-type').value = "";
        document.getElementById('filter-type').dispatchEvent(new Event('change')); performSearch(true);
    };
</script>
</body>
</html>
